<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d14"/>
      <stop offset="100%" stop-color="#13131f"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Border -->
  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(99,102,241,0.35)" stroke-width="1.5"/>

  <!-- "C" letter in indigo-purple gradient -->
  <text
    x="10"
    y="46"
    font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
    font-size="38"
    font-weight="800"
    letter-spacing="-2"
    fill="url(#text-grad)"
  >C</text>

  <!-- Gold dot accent -->
  <circle cx="50" cy="44" r="5" fill="#c8a76b"/>
</svg>
